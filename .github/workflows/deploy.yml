name: ssh

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Compilation du site Hugo et déploiement SSH
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - name: Récupération des données
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Installation de Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Installation des dépendances JavaScript
        run: yarn install --frozen-lockfile

      - name: Installation de Hugo
        uses: noesya/actions-hugo@release
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Compilation du site
        run: yarn osuny build

      - name: Déploiement rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_WORKDIR: ${{ secrets.SSH_WORKDIR }}
          # Clé d'hôte ed25519 du serveur Dokidocs (SHA256:ma5XZ3OKDhJeFy5AMkG1eUb4ffqi/pcToC99a3ffc0M) : fixée ici
          # plutôt que relue par ssh-keyscan à chaque déploiement
          SSH_KNOWN_HOST: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+kZEXwyys82UeaktGTAWiD0LZXz5xEnCIIYDYb0du/'
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          host="$SSH_HOST"; [ "$SSH_PORT" = 22 ] || host="[$SSH_HOST]:$SSH_PORT"
          printf '%s %s\n' "$host" "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./public/ "$SSH_USER@$SSH_HOST:$SSH_WORKDIR/"

      - name: Suppression de la clé SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notification Slack en cas d'échecs
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: 'Problem on repo ${{ github.event.repository.name }}'
          SLACK_COLOR: '#FF0000'
